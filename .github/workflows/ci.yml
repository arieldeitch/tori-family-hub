name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run lint
      - run: bun run test
      - run: bun run build

      # `vite build` regenerates src/routeTree.gen.ts (TanStack Start route
      # generation). That file is committed generated runtime source, so a clean
      # checkout must build to an identical file. If the build changed it, the
      # committed route tree is stale — see docs/decisions.md (ADR-022).
      - name: Verify generated route tree is up to date
        run: bun run routes:check

      # Scans src/ AND the freshly built .output/ + dist/ for service-role key
      # names, the sb_secret_ prefix and VITE_*SERVICE_ROLE variables. The
      # browser bundle must never carry service-role material.
      - name: Check no service-role material reaches the client
        run: bun run check:client-secrets

  database:
    # Validates the local Supabase infrastructure: migrations, seed, generated
    # types freshness, and a public-key-only API smoke test. Local-only — no
    # remote project, no secrets, no `db push`, no deploy.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile

      # Start only the containers needed for schema + REST validation. Excludes
      # studio, storage, realtime, functions and the analytics/vector logging
      # stack to keep CI lean and avoid flaky logging containers.
      - name: Start local Supabase (DB + API only)
        run: >-
          bunx supabase start
          -x studio,imgproxy,inbucket,realtime,storage,edge-runtime,functions,analytics,vector,meta
          --ignore-health-check

      - name: Reset database (apply migrations + seed)
        run: bunx supabase db reset

      - name: Verify generated database types are up to date
        run: bun run db:types:check

      # Public values only — the local publishable key is a well-known dev value,
      # never the service role key.
      - name: Export public Supabase env
        run: |
          JSON="$(bunx supabase status -o json)"
          echo "VITE_SUPABASE_URL=$(echo "$JSON" | jq -r '.API_URL')" >> "$GITHUB_ENV"
          echo "VITE_SUPABASE_PUBLISHABLE_KEY=$(echo "$JSON" | jq -r '.PUBLISHABLE_KEY // .ANON_KEY')" >> "$GITHUB_ENV"

      - name: Smoke test (public URL + key only)
        run: bun run db:smoke

      # Structural + policy-catalog pgTAP. Runs BEFORE any fixture exists,
      # because it asserts the shared seed is business-empty. Each file is
      # transactional and rolls back, so it leaves no residue.
      - name: Structural and policy-catalog tests (pgTAP)
        run: bun run db:test:structure

      # WP4 Auth-backed suite: creates deterministic Auth identities via the
      # Auth admin API and domain rows via service_role, runs the behavioural
      # RLS pgTAP tests and the publishable-key integration tests, then cleans
      # up in a finally block.
      #
      # The service-role key is masked before any command can emit it, is passed
      # only to this step's process, and is never written to GITHUB_ENV, a file
      # or a VITE_* variable.
      - name: Auth-backed RLS suite (behavioural pgTAP + integration)
        run: |
          JSON="$(bunx supabase status -o json)"
          KEY="$(echo "$JSON" | jq -r '.SERVICE_ROLE_KEY // .SECRET_KEY')"
          echo "::add-mask::$KEY"
          SUPABASE_SERVICE_ROLE_KEY="$KEY" bun run db:test:auth-suite
          SUPABASE_SERVICE_ROLE_KEY="$KEY" bun run check:client-secrets

      # Fixture teardown must have restored the business-empty state: re-running
      # the structural suite proves seed.sql is still business-empty.
      - name: Confirm the shared seed is still business-empty
        run: bun run db:test:structure

      - name: Stop Supabase
        if: always()
        run: bunx supabase stop --no-backup
